# Project-wide Gradle settings for Chess Insight Analyzer (Pure Kotlin + Jetpack Compose)
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# Optional Local Release Signing (override via environment variables or edit here):
# CHESS_UPLOAD_STORE_FILE=release-key.jks
# CHESS_UPLOAD_STORE_PASSWORD=your_keystore_password
# CHESS_UPLOAD_KEY_ALIAS=your_key_alias
# CHESS_UPLOAD_KEY_PASSWORD=your_key_password
